<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagyra PHP Playground</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <strong>Pagyra PHP Playground</strong>
        <span class="subtitle">pure PHP renderer</span>
      </div>
      <div class="controls">
        <label>Template
          <select id="template"></select>
        </label>
        <label>W <input id="viewport-width" type="number" min="200" value="794"></label>
        <label>H <input id="viewport-height" type="number" min="200" value="1123"></label>
        <button id="render" type="button">Convert to PDF</button>
        <a href="https://github.com/celsowm/pagyra-php" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </header>

    <main class="workspace">
      <section class="panel editor-panel">
        <div class="tabs">
          <button class="tab active" data-editor="html">HTML</button>
          <button class="tab" data-editor="css">CSS</button>
        </div>
        <textarea id="html" class="editor active" spellcheck="false"></textarea>
        <textarea id="css" class="editor" spellcheck="false"></textarea>
      </section>

      <section class="panel preview-panel">
        <div class="tabs">
          <button class="tab active" data-preview="pdf">PDF</button>
          <button class="tab" data-preview="html">HTML</button>
          <button class="tab" data-preview="diagnostics">Diagnostics</button>
        </div>
        <div id="pdf-pane" class="preview active">
          <object id="pdf" type="application/pdf"></object>
          <div id="empty" class="empty">Click “Convert to PDF” to render with pagyra-php.</div>
        </div>
        <div id="html-pane" class="preview">
          <iframe id="html-preview" sandbox="allow-same-origin"></iframe>
        </div>
        <div id="diagnostics-pane" class="preview diagnostics">
          <pre id="diagnostics">No diagnostics yet.</pre>
        </div>
      </section>
    </main>

    <footer>
      <span id="status" data-tone="neutral">Ready.</span>
      <span>The browser is only the UI; PDF bytes come from <code>Pagyra::renderHtmlToPdf()</code>.</span>
    </footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
